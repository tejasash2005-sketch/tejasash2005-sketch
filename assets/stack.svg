<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Tejas S. — Technology Stack</title>
<desc id="desc">A modern dark neon technology stack with fifteen skills and learning areas grouped into languages, frontend, backend, data, and developer tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b35"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#25a8ff"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#fb3e78"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#25416c" stroke-opacity=".22" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="760" rx="28" fill="url(#bg)"/><rect width="1100" height="760" rx="28" fill="url(#grid)"/>
<circle cx="1010" cy="75" r="160" fill="#244fff" opacity=".08"/><circle cx="60" cy="690" r="180" fill="#b52eff" opacity=".07"/>
<rect x="26" y="24" width="1048" height="712" rx="22" fill="none" stroke="#244b84" stroke-opacity=".8"/>
<text x="58" y="66" fill="#55b8ff" font-family="monospace" font-size="14" letter-spacing="4">DEVELOPER TOOLKIT / 01</text>
<text x="58" y="112" fill="#f3f6ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">My Technology Stack</text>
<text x="58" y="142" fill="#9eafd0" font-family="Arial, Helvetica, sans-serif" font-size="16">15 technologies &amp; skills I use or am learning</text>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="58" y="184" fill="#69baff" font-size="13" font-weight="700" letter-spacing="2">01 / LANGUAGES &amp; WEB</text>
  <g>
    <rect x="58" y="200" width="310" height="58" rx="13" fill="#101e38" stroke="#2d8bff" stroke-opacity=".8"/><rect x="58" y="200" width="4" height="58" rx="2" fill="url(#blue)"/><text x="78" y="225" fill="#f3f6ff" font-size="17" font-weight="700">Python</text><text x="78" y="244" fill="#8ea5ca" font-size="12">Scripting &amp; backend foundations</text>
    <rect x="395" y="200" width="310" height="58" rx="13" fill="#101e38" stroke="#2d8bff" stroke-opacity=".8"/><rect x="395" y="200" width="4" height="58" rx="2" fill="url(#blue)"/><text x="415" y="225" fill="#f3f6ff" font-size="17" font-weight="700">JavaScript</text><text x="415" y="244" fill="#8ea5ca" font-size="12">Interactive web experiences</text>
    <rect x="732" y="200" width="310" height="58" rx="13" fill="#101e38" stroke="#2d8bff" stroke-opacity=".8"/><rect x="732" y="200" width="4" height="58" rx="2" fill="url(#blue)"/><text x="752" y="225" fill="#f3f6ff" font-size="17" font-weight="700">HTML5 &amp; CSS3</text><text x="752" y="244" fill="#8ea5ca" font-size="12">Structure, styling &amp; responsive UI</text>
  </g>
  <text x="58" y="300" fill="#c08bff" font-size="13" font-weight="700" letter-spacing="2">02 / FRAMEWORKS &amp; BACKEND</text>
  <g>
    <rect x="58" y="316" width="310" height="58" rx="13" fill="#211a3c" stroke="#a855f7" stroke-opacity=".8"/><rect x="58" y="316" width="4" height="58" rx="2" fill="url(#pink)"/><text x="78" y="341" fill="#f3f6ff" font-size="17" font-weight="700">Django</text><text x="78" y="360" fill="#b8a8d9" font-size="12">Python web framework</text>
    <rect x="395" y="316" width="310" height="58" rx="13" fill="#211a3c" stroke="#a855f7" stroke-opacity=".8"/><rect x="395" y="316" width="4" height="58" rx="2" fill="url(#pink)"/><text x="415" y="341" fill="#f3f6ff" font-size="17" font-weight="700">React</text><text x="415" y="360" fill="#b8a8d9" font-size="12">Component-based interfaces</text>
    <rect x="732" y="316" width="310" height="58" rx="13" fill="#211a3c" stroke="#a855f7" stroke-opacity=".8"/><rect x="732" y="316" width="4" height="58" rx="2" fill="url(#pink)"/><text x="752" y="341" fill="#f3f6ff" font-size="17" font-weight="700">Node.js</text><text x="752" y="360" fill="#b8a8d9" font-size="12">JavaScript runtime</text>
  </g>
  <text x="58" y="416" fill="#ff8cae" font-size="13" font-weight="700" letter-spacing="2">03 / DATA &amp; STORAGE</text>
  <g>
    <rect x="58" y="432" width="310" height="58" rx="13" fill="#291b35" stroke="#f34e8a" stroke-opacity=".8"/><rect x="58" y="432" width="4" height="58" rx="2" fill="url(#pink)"/><text x="78" y="457" fill="#f3f6ff" font-size="17" font-weight="700">MongoDB</text><text x="78" y="476" fill="#d5a9bf" font-size="12">Document database</text>
    <rect x="395" y="432" width="310" height="58" rx="13" fill="#291b35" stroke="#f34e8a" stroke-opacity=".8"/><rect x="395" y="432" width="4" height="58" rx="2" fill="url(#pink)"/><text x="415" y="457" fill="#f3f6ff" font-size="17" font-weight="700">SQL</text><text x="415" y="476" fill="#d5a9bf" font-size="12">Querying relational data</text>
    <rect x="732" y="432" width="310" height="58" rx="13" fill="#291b35" stroke="#f34e8a" stroke-opacity=".8"/><rect x="732" y="432" width="4" height="58" rx="2" fill="url(#pink)"/><text x="752" y="457" fill="#f3f6ff" font-size="17" font-weight="700">REST APIs</text><text x="752" y="476" fill="#d5a9bf" font-size="12">Connecting web services</text>
  </g>
  <text x="58" y="532" fill="#69e0c0" font-size="13" font-weight="700" letter-spacing="2">04 / TOOLS &amp; WORKFLOW</text>
  <g>
    <rect x="58" y="548" width="310" height="58" rx="13" fill="#102e31" stroke="#29c7a4" stroke-opacity=".8"/><rect x="58" y="548" width="4" height="58" rx="2" fill="#29c7a4"/><text x="78" y="573" fill="#f3f6ff" font-size="17" font-weight="700">Git &amp; GitHub</text><text x="78" y="592" fill="#9bd6cc" font-size="12">Version control &amp; collaboration</text>
    <rect x="395" y="548" width="310" height="58" rx="13" fill="#102e31" stroke="#29c7a4" stroke-opacity=".8"/><rect x="395" y="548" width="4" height="58" rx="2" fill="#29c7a4"/><text x="415" y="573" fill="#f3f6ff" font-size="17" font-weight="700">VS Code</text><text x="415" y="592" fill="#9bd6cc" font-size="12">Code editor &amp; extensions</text>
    <rect x="732" y="548" width="310" height="58" rx="13" fill="#102e31" stroke="#29c7a4" stroke-opacity=".8"/><rect x="732" y="548" width="4" height="58" rx="2" fill="#29c7a4"/><text x="752" y="573" fill="#f3f6ff" font-size="17" font-weight="700">Linux &amp; Terminal</text><text x="752" y="592" fill="#9bd6cc" font-size="12">Command-line basics</text>
  </g>
  <text x="58" y="648" fill="#ffcb78" font-size="13" font-weight="700" letter-spacing="2">05 / ENGINEERING MINDSET</text>
  <g>
    <rect x="58" y="664" width="310" height="48" rx="12" fill="#342a1c" stroke="#f5b94c" stroke-opacity=".8"/><text x="78" y="693" fill="#fff5df" font-size="16" font-weight="700">Problem Solving</text>
    <rect x="395" y="664" width="310" height="48" rx="12" fill="#342a1c" stroke="#f5b94c" stroke-opacity=".8"/><text x="415" y="693" fill="#fff5df" font-size="16" font-weight="700">Clean, Readable Code</text>
    <rect x="732" y="664" width="310" height="48" rx="12" fill="#342a1c" stroke="#f5b94c" stroke-opacity=".8"/><text x="752" y="693" fill="#fff5df" font-size="16" font-weight="700">Continuous Learning</text>
  </g>
</g>
<circle cx="1035" cy="66" r="5" fill="#41c5ff" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>